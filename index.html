  <body>
    <div id="app">
      <div id="stage"></div>
      <div id="overlay"></div>
      <header id="topbar">
        <div class="brand glass">
          <span id="gameTitle" class="title"></span>
        </div>
        <div class="status glass">
          <span id="turnInfo" class="turn" role="button" tabindex="0"></span>
          <span id="phaseInfo" class="phase"></span>
          <span id="weatherInfo" class="weather"></span>
        </div>
        <span class="spacer"></span>
        <div class="tools glass">
          <button data-rot="-1" class="icon" title="Q" aria-label="⟲ camera"><svg class="rot-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.07 10.78A9.5 6.5 0 1 0 20.23 16.25" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M22.29 13.81 21.83 18.39 17.85 15.03Z" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><path d="M12 5.4 17.4 8.3 12 11.2 6.6 8.3Z" fill="currentColor"/><path d="M6.6 8.3V12L12 14.9 17.4 12V8.3L12 11.2Z" fill="currentColor" opacity=".55"/></svg></button>
          <button data-rot="1" class="icon" title="E" aria-label="⟳ camera"><svg class="rot-ic" viewBox="0 0 24 24" aria-hidden="true" style="transform:scaleX(-1)"><path d="M3.07 10.78A9.5 6.5 0 1 0 20.23 16.25" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M22.29 13.81 21.83 18.39 17.85 15.03Z" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/><path d="M12 5.4 17.4 8.3 12 11.2 6.6 8.3Z" fill="currentColor"/><path d="M6.6 8.3V12L12 14.9 17.4 12V8.3L12 11.2Z" fill="currentColor" opacity=".55"/></svg></button>
          <button id="threatBtn" class="icon" title="T">◈</button>
          <button id="muteBtn" class="icon" title="BGM / SE">♪</button>
          <select id="langSel"></select>
          <span class="gm-wrap">
            <button id="gameMenuBtn" class="ghost" aria-haspopup="menu"></button>
            <div id="gameMenu" class="glass" role="menu">
              <button id="saveBtn" role="menuitem"></button>
              <button id="loadBtn" role="menuitem"></button>
              <button id="restartBtn" role="menuitem"></button>
              <button id="retreatBtn" role="menuitem" hidden></button>
              <button id="libraryBtn" role="menuitem"></button>
              <button id="titleBtn" role="menuitem"></button>
              <button id="cheatBtn" role="menuitem" hidden></button>
            </div>
          </span>
          <button id="settingsBtn" class="ghost"></button>
        </div>
        <div id="autoBar" class="glass" hidden><button id="autoBtn"></button><button id="speedBtn"></button></div>
        <button id="endPhase" class="primary"></button>
        <button id="toolsBtn" class="icon glass" aria-expanded="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="5" cy="12" r="2.2" fill="currentColor"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><circle cx="19" cy="12" r="2.2" fill="currentColor"/></svg></button>
      </header>

      <aside id="unitPanel" class="panel hidden"></aside>
      <div id="tilePanel" class="panel tile"></div>
      <div id="forecast" class="panel"></div>
      <nav id="menu" class="panel"></nav>
      <div id="hint"></div>
      <div id="log" class="panel"></div>
      <div id="help"></div>
      <div id="banner"></div>
      <div id="modal"></div>
